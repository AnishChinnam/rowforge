name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.lock
      - run: pip install -e '.[dev]'
      - run: ruff check rowforge tests scripts
      - run: pytest -q
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rowforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rowforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rowforge"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://rowforge:ci-only-password@127.0.0.1:5432/rowforge
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pytest tests/test_services.py -q
      - run: python scripts/verify_recovery.py
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock
      - run: docker compose up --build -d --scale worker=2
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8082/health
      - run: python scripts/verify_live.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
