[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowforge"
version = "0.1.0"
description = "Durable, private CSV processing with recoverable background workers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
rowforge = "rowforge.__main__:main"

[tool.setuptools.package-data]
rowforge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
